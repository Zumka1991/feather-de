[package]
name = "feather-files"
version = "0.1.0"
edition = "2021"
description = "Файлы — сверхбыстрый файловый менеджер Пёрышка в стиле macOS Tahoe"
license = "GPL-3.0-or-later"
repository = "https://github.com/Zumka1991/feather-de"

[[bin]]
name = "feather-files"
path = "src/main.rs"

[dependencies]
smithay-client-toolkit = { version = "0.19.2", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
tiny-skia = "0.12.0"
feather-ui = { path = "../crates/feather-ui" }
zeroize = "1"
libc = "0.2"
chrono = "0.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = { version = "0.48.1", default-features = false }
