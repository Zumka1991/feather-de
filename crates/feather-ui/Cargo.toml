[package]
name = "feather-ui"
version = "0.1.0"
edition = "2021"
description = "Общие для Пёрышка и его программ: масштаб, текст, примитивы рисования, иконки файлов"

[dependencies]
tiny-skia = "0.12.0"
ttf-parser = "0.25.1"
memmap2 = "0.9.12"
tracing = "0.1"
libc = "0.2"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime_guess = "2.0.5"

[dev-dependencies]
fontdue = "0.9.5"
