[package]
name = "feather-terminal"
version = "0.1.0"
edition = "2021"
description = "Терминал — быстрый и лёгкий терминал Пёрышка в стиле macOS Tahoe, со своим ядром VT/xterm"

[[bin]]
name = "feather-terminal"
path = "src/main.rs"

[dependencies]
smithay-client-toolkit = { version = "0.19.2", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
tiny-skia = "0.12.0"
feather-ui = { path = "../crates/feather-ui" }
libc = "0.2"
unicode-width = "0.2"
base64 = "0.22"
