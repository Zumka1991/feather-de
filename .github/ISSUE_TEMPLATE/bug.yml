name: Bug report · Сообщить об ошибке
description: Something does not work as it should. Что-то работает не так, как должно.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make Feather better! Questions and ideas are easier to discuss on the
        [forum](https://github.com/Zumka1991/feather-de/discussions); please use this form only for bugs.

        Спасибо, что помогаете! Можно писать по-русски. Вопросы и идеи — на форуме, здесь только ошибки.
  - type: textarea
    id: what
    attributes:
      label: What happened · Что случилось
      description: What you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce · Как повторить
      placeholder: |
        1. Open …
        2. Click …
        3. See that …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Feather version · Версия Пёрышка
      description: "Menu 🪶 → About This Computer, or run `featherctl version`."
      placeholder: 0.25.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method · Как установлено
      options:
        - Feather OS image (ISO)
        - Ubuntu, install script or APT
        - Arch Linux, pacman
        - Built from source
        - Other
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution · Дистрибутив
      placeholder: Ubuntu 26.04
  - type: input
    id: gpu
    attributes:
      label: GPU and driver · Видеокарта и драйвер
      placeholder: AMD Radeon RX 570, Mesa 26.0
    validations:
      required: true
  - type: input
    id: display
    attributes:
      label: Displays and scaling · Мониторы и масштаб
      placeholder: one 4K monitor, 60 Hz, 200 % scale
  - type: dropdown
    id: mode
    attributes:
      label: Session type · Режим запуска
      options:
        - Regular session (DRM/KMS)
        - Nested window (--windowed)
        - I don't know
  - type: textarea
    id: log
    attributes:
      label: Log · Лог
      description: If you have one (~/.local/state/feather-de/drm.log). Make sure it holds no personal data.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Screenshots and anything else · Снимки экрана и прочее
      description: Only include on screenshots what you are happy to publish.
