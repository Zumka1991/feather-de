# Выпуск Пёрышка: тег v<версия из Cargo.toml> → пакет .deb в APT-репозитории и пакет pacman
# в репозитории Arch Linux (arch/), оба на GitHub Pages (ветка gh-pages), и в GitHub Release.
# Вручную (workflow_dispatch) — сборка +git<дата>.
# Секрет APT_SIGNING_KEY: закрытый ключ GPG репозиториев (gpg --armor --export-secret-keys).
name: Выпуск

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apt-repository
  cancel-in-progress: false

jobs:
  # Пакет для Arch Linux собирается в контейнере Arch: под его glibc и библиотеки
  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    env:
      CARGO_HOME: /cargo
      CARGO_TARGET_DIR: /cargo/target
    steps:
      - name: Зависимости сборки
        run: |
          pacman -Syu --noconfirm --needed git rust clang pkgconf
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            /cargo/registry
            /cargo/git
            /cargo/target
          key: cargo-arch-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-arch-

      - name: Ключ подписи
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::error::Нет секрета APT_SIGNING_KEY"
            exit 1
          fi
          printf '%s\n' "$APT_SIGNING_KEY" | sudo -u builder gpg --batch --import

      - name: Пакет pacman
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /cargo
          chown -R builder: "$GITHUB_WORKSPACE" /cargo
          key="$(sudo -u builder gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          cd packaging
          sudo -u builder --preserve-env=CARGO_HOME,CARGO_TARGET_DIR \
            makepkg --syncdeps --noconfirm --sign --key "$key"
          sudo -u builder ./publish-arch.sh ../arch-repo feather-de-*.pkg.tar.zst --key "$key"
          ls -la ../arch-repo/*

      - uses: actions/upload-artifact@v4
        with:
          name: arch-repo
          path: arch-repo
          retention-days: 7

  release:
    needs: arch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Тег совпадает с версией в Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Тег $GITHUB_REF_NAME, а в Cargo.toml версия $version"
            exit 1
          fi

      - name: Зависимости сборки
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config dpkg-dev \
            libdrm-dev libgbm-dev libinput-dev libseat-dev libudev-dev libxkbcommon-dev \
            libwayland-dev libegl-dev libgles-dev libpam0g-dev libpipewire-0.3-dev \
            libxcb1-dev libxcb-cursor-dev libclang-dev clang

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Пакет .deb
        run: ./packaging/build-deb.sh --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-deb
          path: dist/*.deb
          retention-days: 14

      - uses: actions/download-artifact@v4
        with:
          name: arch-repo
          path: arch-repo

      - name: Ключ подписи
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::error::Нет секрета APT_SIGNING_KEY"
            exit 1
          fi
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import

      - name: APT-репозиторий (ветка gh-pages)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git worktree add apt gh-pages
          else
            git worktree add --orphan -b gh-pages apt
          fi
          key="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          ./packaging/publish-apt.sh apt dist/*.deb --key "$key" --keep 3
          # pacman-репозиторий Arch Linux из задания arch — целиком вместо прежнего
          rm -rf apt/arch
          cp -r arch-repo apt/arch
          # Один коммит без истории: старые пакеты не копятся в репозитории
          cd apt
          git checkout --orphan publish
          git add -A
          git commit -qm "APT: $GITHUB_REF_NAME"
          git push -f origin publish:gh-pages

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Постоянная ссылка для сайта: releases/latest/download/feather-de_amd64.deb
          cp dist/feather-de_*_amd64.deb feather-de_amd64.deb
          gh release create "$GITHUB_REF_NAME" dist/*.deb feather-de_amd64.deb \
            arch-repo/x86_64/feather-de-*.pkg.tar.zst \
            --title "Пёрышко $GITHUB_REF_NAME" --generate-notes

      - name: GitHub Pre-release (ветка)
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ci-$(printf '%s' "$GITHUB_REF_NAME" | tr '/' '-')"
          cp dist/feather-de_*_amd64.deb feather-de_amd64.deb
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" dist/*.deb feather-de_amd64.deb \
            arch-repo/x86_64/feather-de-*.pkg.tar.zst \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Пёрышко — сборка ветки $GITHUB_REF_NAME" \
            --notes "Тестовая сборка ветки \`$GITHUB_REF_NAME\` (\`$GITHUB_SHA\`) для Ubuntu (\`.deb\`) и Arch Linux (\`.pkg.tar.zst\`). Пакет также опубликован в APT-репозитории Пёрышка."
