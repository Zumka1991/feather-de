[package]
name = "feather-textedit"
version = "0.1.0"
edition = "2021"
description = "Текстовый редактор — редактор текста и кода Пёрышка в стиле macOS Tahoe"

[[bin]]
name = "feather-textedit"
path = "src/main.rs"

[dependencies]
smithay-client-toolkit = { version = "0.19.2", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
tiny-skia = "0.12.0"
feather-ui = { path = "../crates/feather-ui" }
libc = "0.2"
