[package]
name = "feather-de"
version = "0.2.0"
edition = "2021"
description = "Пёрышко (Feather DE) — сверхбыстрое и легкое окружение рабочего стола для Wayland в стиле macOS на Rust"

[dependencies]
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "desktop",
    "renderer_gl",
    "wayland_frontend",
] }
tiny-skia = "0.12.0"
ttf-parser = "0.25.1"
memmap2 = "0.9.12"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
bitflags = "2.6"
resvg = { version = "0.48.1", default-features = false }
xcursor = "0.3"
png = "0.18"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
feather-ui = { path = "crates/feather-ui" }
wayland-protocols-plasma = { version = "0.3", features = ["server"] }
# gtk_shell1 (GTK global menus) is generated from protocols/gtk-shell.xml
wayland-server = "0.31"
wayland-scanner = "0.31"
zbus = { version = "5.18", default-features = false, features = ["async-io"] }
async-channel = "2"
futures-lite = "2"
serde_json = "1"
# Second X connection for the minimize/maximize requests xwayland-satellite ignores
x11rb = { version = "0.13", default-features = false }
zeroize = "1"
libloading = "0.8"

[workspace]
members = [".", "files", "terminal", "notes", "preview", "textedit", "calc", "installer", "crates/feather-ui"]
default-members = [".", "files", "terminal", "notes", "preview", "textedit", "calc", "installer"]

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
