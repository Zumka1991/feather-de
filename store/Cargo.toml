[package]
name = "feather-store"
version = "0.1.0"
edition = "2021"
description = "Магазин — каталог программ Пёрышка: поиск, установка и удаление через PackageKit"

[[bin]]
name = "feather-store"
path = "src/main.rs"

[dependencies]
smithay-client-toolkit = { version = "0.19.2", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
tiny-skia = "0.12.0"
flate2 = "1"
zbus = { version = "5.18", default-features = false, features = ["async-io"] }
futures-lite = "2"
feather-ui = { path = "../crates/feather-ui" }
